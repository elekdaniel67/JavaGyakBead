<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout('Üzenetek - Szoftverleltár', ~{::section})}">
<body>
<section class="container flex-grow-1 py-5">
    <div class="gc p-4 p-md-5 mt-4 afu">
        <h1 class="stitle text-white mb-4">Beérkezett üzenetek</h1>

        <div class="table-responsive">
            <table class="db-table">
                <thead>
                <tr>
                    <th scope="col">Küldés ideje</th>
                    <th scope="col">Név</th>
                    <th scope="col">E-mail-cím</th>
                    <th scope="col">Üzenet</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(uzenetek)}">
                    <td colspan="4">Még nem érkezett üzenet.</td>
                </tr>
                <tr th:each="uzenet : ${uzenetek}">
                    <td class="text-nowrap"
                        th:text="${#temporals.format(uzenet.kuldve, 'yyyy. MM. dd. HH:mm:ss', 'Europe/Budapest')}"></td>
                    <td th:text="${uzenet.nev}"></td>
                    <td th:text="${uzenet.email}"></td>
                    <td style="white-space: pre-wrap; overflow-wrap: anywhere;"
                        th:text="${uzenet.szoveg}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</body>
</html>
