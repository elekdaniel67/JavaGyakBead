<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout('Kapcsolat - Szoftverleltár', ~{::section})}">
<body>
<section class="container flex-grow-1 py-5">
    <div class="gc p-4 p-md-5 mt-4 afu">
        <h1 class="stitle text-white">Kapcsolat</h1>
        <p class="ssub mb-4">Küldj üzenetet az oldal üzemeltetőinek!</p>

        <div class="alert alert-success" role="status" th:if="${sikeresKuldes}">
            Az üzenetedet sikeresen elküldtük.
        </div>

        <form th:action="@{/kapcsolat}" th:object="${kapcsolatUrlap}" method="post">
            <label for="nev" class="olbl">Név</label>
            <input type="text" id="nev" th:field="*{nev}" class="oinp"
                   th:errorclass="border-danger" autocomplete="name" maxlength="100" required>
            <p class="err-msg d-block" th:errors="*{nev}"></p>

            <label for="email" class="olbl">E-mail-cím</label>
            <input type="email" id="email" th:field="*{email}" class="oinp"
                   th:errorclass="border-danger" autocomplete="email" maxlength="254" required>
            <p class="err-msg d-block" th:errors="*{email}"></p>

            <label for="szoveg" class="olbl">Üzenet</label>
            <textarea id="szoveg" th:field="*{szoveg}" class="oinp"
                      th:errorclass="border-danger" rows="6" maxlength="2000" required></textarea>
            <p class="err-msg d-block" th:errors="*{szoveg}"></p>

            <button type="submit" class="bgrd px-4 py-2">Üzenet küldése</button>
        </form>
    </div>
</section>
</body>
</html>
