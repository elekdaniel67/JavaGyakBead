<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">Szoftverleltár</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="d-flex flex-column min-vh-100">

<nav id="nbar">
    <div class="container d-flex align-items-center justify-content-between">
        <a class="d-flex align-items-center gap-2 fw-bold fs-5 text-white" th:href="@{/}">
            <span class="logo-i"><i class="bi bi-cpu"></i></span>
            <span>Szoftverleltár</span>
        </a>

        <div class="d-none d-lg-flex align-items-center gap-1">
            <a class="nav-link" th:href="@{/}">Főoldal</a>
            <a class="nav-link" sec:authorize="isAuthenticated()" th:href="@{/user}">User</a>
            <a class="nav-link" sec:authorize="hasAnyAuthority('ROLE_ADMIN', 'ADMIN')" th:href="@{/admin}">Admin</a>
        </div>

        <div class="d-none d-lg-flex align-items-center gap-2">
            <a class="nav-link" sec:authorize="isAnonymous()" th:href="@{/register}">Register</a>
            <a class="boc px-3 py-2 text-decoration-none" sec:authorize="isAnonymous()" th:href="@{/login}">
                <i class="bi bi-box-arrow-in-right me-1"></i> Login
            </a>

            <span sec:authorize="isAuthenticated()" style="color: var(--tx2); font-size: 0.85rem;" class="me-2">
                Bejelentkezve: <strong class="text-white" sec:authentication="name"></strong>
            </span>
            <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="boc px-3 py-1">Logout</button>
            </form>
        </div>

        <button class="boc px-2 py-1 d-lg-none" type="button"
                onclick="document.getElementById('mbmenu').classList.toggle('open')">
            <i class="bi bi-list fs-4"></i>
        </button>
    </div>
</nav>

<div id="mbmenu" class="d-lg-none">
    <div class="d-flex flex-column gap-2">
        <a class="nav-link" th:href="@{/}">Főoldal</a>
        <a class="nav-link" sec:authorize="isAuthenticated()" th:href="@{/user}">User</a>
        <a class="nav-link" sec:authorize="hasAnyAuthority('ROLE_ADMIN', 'ADMIN')" th:href="@{/admin}">Admin</a>
        <hr style="border-color: var(--bd);">
        <a class="nav-link" sec:authorize="isAnonymous()" th:href="@{/register}">Register</a>
        <a class="bgrd text-center py-2" sec:authorize="isAnonymous()" th:href="@{/login}">Login</a>
        <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post">
            <button type="submit" class="boc w-100 py-2">Logout (<span sec:authentication="name"></span>)</button>
        </form>
    </div>
</div>

<main class="flex-grow-1 d-flex flex-column" style="padding-top: var(--nav);" th:replace="${content}"></main>

<footer id="foot" class="py-4 mt-auto text-center">
    <div class="container">
        <span style="color: var(--tx2); font-size: 0.88rem;">
            Készítők: <strong class="text-white">Fülöp Martin - EMD87F</strong> &amp; <strong class="text-white">Elek Dániel - XZN3PZ</strong>
        </span>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    window.addEventListener('scroll', () => {
        document.getElementById('nbar')?.classList.toggle('scr', window.scrollY > 20);
    });
</script>
</body>
</html>
