<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: layout('Főoldal - Szoftverleltár', ~{::section})}">
<body>
<section class="container flex-grow-1 d-flex flex-column justify-content-center align-items-center text-center py-5">
    <div class="hero-badge mb-4">
        <span class="hero-badge-dot"></span>
        <span>Java &amp; Spring Boot Webalkalmazás</span>
    </div>

    <h1 class="hero-title mb-4">
        Szoftverleltár és<br>
        <span class="text-gradient">Licenc Nyilvántartás</span>
    </h1>

    <p class="hero-subtitle mb-5">
        Vállalati szoftverek, kategóriák és munkaállomás-telepítések átlátható kezelése,
        statisztikai elemzése és valós idejű nyilvántartása egyetlen modern felületen.
    </p>

    <div class="d-flex flex-wrap justify-content-center gap-3" sec:authorize="isAnonymous()">
        <a th:href="@{/login}" class="btn btn-gradient">
            Bejelentkezés <i class="bi bi-arrow-right ms-1"></i>
        </a>
        <a th:href="@{/register}" class="btn btn-dark-outline">
            <i class="bi bi-person-plus me-1"></i> Regisztráció
        </a>
    </div>

    <div sec:authorize="isAuthenticated()" class="glass-card px-4 py-3 mt-2">
        <span class="text-secondary">Sikeresen bejelentkezve mint:</span>
        <strong class="text-white ms-1" sec:authentication="name"></strong>
    </div>
</section>
</body>
</html>
